services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # Scale with: docker compose up --scale lattice=N
  lattice:
    build: .
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      PUSH_SECRET: ${PUSH_SECRET:-dev-push-secret}
    depends_on:
      - redis

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - lattice
